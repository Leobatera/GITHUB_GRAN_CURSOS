<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script>

    // Passo 1 - Entrada de dados
    const n1 = parseInt(prompt("Digite o primeiro número:"))
    const n2 = parseInt(prompt("Digite o segundo número:"))
    // parseInt transforma a string em número inteiro
    // parseFloat transforma a string em número decimal
    // se colocar o nome da variavel para num, ele ja vai entender que é numero, sendo inteiro ou decimal.

    // Passo 2 - Processamento
    const soma = n1 + n2

    // Passo 3 - Saída de dados
    console.log("A soma dos números é: " + soma)

    </script>
</head>

</body>
</html>
