<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estruturas de Repetição</title>

    <script>

        let contador = 1
        const qtd = prompt("Quantas Notas?")
        let soma = 0
        let nota = 0
        
        while (contador <= qtd) {
            do{nota = Number(prompt('Digite a nota ' + contador + ': '))
        }while( nota > 10)
        soma = soma + Number(nota)
            contador++
        }

        console.log('soma: ' + soma)
        console.log('nota: ' + nota)

        const media = soma / qtd
        console.log('Média: ' + soma / media)

        const resultado = media >=7 ? 'Aprovado' : 'Reprovado'
        console.log('Resultado: ' + resultado)

    </script>
</head>

</body>
</html>
